<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The DelQuro Files Pro — AI Code Receiver &amp; Build Tracker</title>
<!-- ==========================================================================
     The DelQuro Files — single-file HTML edition (v0.11.0)
     Zero dependencies. No server. No install.
     - Open this file directly in any browser, or host it on GitHub Pages.
     - Data is saved in this browser (localStorage). Use Export to back it up,
       and Import to restore on another device.
     ========================================================================== -->
<style>
:root {
  --bg: #090d16; --bg2: #0c1120; --panel: #10182b; --panel2: #151f36;
  --border: #22304c; --border2: #2c3d5e; --text: #eaf0fb; --muted: #93a2c2; --faint: #5c6c90;
  --cyan: #38ccff; --violet: #9d8cff; --green: #35d9a0; --amber: #ffb224; --pink: #ff6fae; --blue: #5b9dff; --red: #ff5f6d;
  --radius: 14px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--sans); color: var(--text); font-size: 15px; line-height: 1.45;
  background: radial-gradient(900px 500px at 85% -10%, rgba(56,204,255,0.08), transparent 60%),
              radial-gradient(800px 500px at -10% 110%, rgba(157,140,255,0.10), transparent 60%), var(--bg);
}
::selection { background: rgba(56,204,255,0.25); }
* { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 8px; }
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
button, a, select, input, textarea, .nav-item, .tab { touch-action: manipulation; }
a { color: var(--cyan); text-decoration: none; }
button { font-family: inherit; }
.mono, code, pre { font-family: var(--mono); }

#app { display: flex; flex-direction: column; min-height: 100vh; }
#sidebar { display: none; }
.brand { display: flex; gap: 11px; align-items: center; padding: 2px 6px 6px; }
.brand-mark {
  width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center; color: var(--cyan);
  background: linear-gradient(135deg, rgba(56,204,255,0.16), rgba(157,140,255,0.16));
  border: 1px solid var(--border2); border-radius: 11px; box-shadow: 0 0 18px rgba(56,204,255,0.12) inset;
}
.brand-text h1 { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: 0.2px; line-height: 1.15; }
.brand-text span { font-size: 11px; color: var(--muted); letter-spacing: 0.4px; }

#nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
  color: var(--muted); font-size: 13.5px; cursor: pointer; transition: background 0.12s, color 0.12s;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav-item.on { background: linear-gradient(90deg, rgba(56,204,255,0.14), rgba(157,140,255,0.07)); color: var(--text); box-shadow: inset 2px 0 0 var(--cyan); }
.nav-ic { display: grid; place-items: center; color: var(--faint); }
.nav-item.on .nav-ic { color: var(--cyan); }
.nav-l { flex: 1; }
.nav-c {
  min-width: 20px; text-align: center; font-size: 11px; font-weight: 600; color: var(--cyan);
  background: rgba(56,204,255,0.12); border: 1px solid rgba(56,204,255,0.25); border-radius: 8px; padding: 1px 6px; font-family: var(--mono);
}
.nav-c:empty { display: none; }

.sidebar-foot { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.foot-btns { display: flex; gap: 6px; }
.foot-btns .btn { flex: 1; justify-content: center; }
.storage { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--faint); padding: 0 4px; }
.storage .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--green); box-shadow: 0 0 6px rgba(53,217,160,0.7); }
.storage.mem .dot { background: var(--amber); box-shadow: 0 0 6px rgba(255,178,36,0.7); }

#content { display: flex; flex-direction: column; min-width: 0; flex: 1; }
#topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: rgba(9,13,22,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}
.qc-label { display: none; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: var(--cyan); font-family: var(--mono); white-space: nowrap; }
.quick-capture { display: none; flex: 1; gap: 8px; }
#qc-type { background: var(--panel); color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; font-size: 13px; outline: none; }
#qc-input {
  flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; color: var(--text);
  padding: 11px 14px; font-size: 14px; outline: none; transition: border 0.15s, box-shadow 0.15s;
}
#qc-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,204,255,0.12); }
#qc-input::placeholder { color: var(--faint); }

#main { padding: 16px 14px 132px; max-width: 1180px; width: 100%; margin: 0 auto; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.ph-txt h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.2px; }
.ph-txt p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.ph-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.block-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 26px 0 12px; }
.spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border2); background: var(--panel);
  color: var(--text); padding: 8px 13px; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; min-height: 44px;
  transition: background 0.12s, border 0.12s, transform 0.06s;
}
.btn:hover { background: var(--panel2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, #0ea5e9, #38ccff); border-color: transparent; color: #04121c; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--red); border-color: rgba(255,95,109,0.4); }
.btn.danger:hover { background: rgba(255,95,109,0.1); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.link-btn.arena { border-color: rgba(56,204,255,0.4); color: var(--cyan); background: rgba(56,204,255,0.08); }
.btn.link-btn.arena:hover { background: rgba(56,204,255,0.14); }
.btn.link-btn.github { border-color: rgba(157,140,255,0.4); color: var(--violet); background: rgba(157,140,255,0.08); }
.btn.link-btn.github:hover { background: rgba(157,140,255,0.14); }
.btn.link-btn.off { color: var(--faint); border-style: dashed; background: transparent; }

.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid transparent;
  background: transparent; color: var(--muted); border-radius: 10px; cursor: pointer; transition: background 0.12s, color 0.12s;
}
.icon-btn:hover { background: var(--panel2); color: var(--text); }
.icon-btn.danger:hover { color: var(--red); background: rgba(255,95,109,0.1); }
.icon-btn.mini { width: 34px; height: 34px; }
select.mini, select { background: var(--panel); color: var(--muted); border: 1px solid var(--border); border-radius: 9px; padding: 6px 9px; font-size: 13px; outline: none; cursor: pointer; }
select:focus { border-color: var(--cyan); }

.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-btn { border: none; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.seg-btn:hover { color: var(--text); }
.seg-btn.on { background: var(--panel2); color: var(--cyan); box-shadow: inset 0 0 0 1px var(--border2); }

.card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 8px; }
.stat {
  display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; cursor: pointer; border: none; text-align: left;
  background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text);
  transition: border 0.12s, transform 0.12s;
}
.stat:hover { border-color: var(--border2); transform: translateY(-2px); }
.stat-ic { opacity: 0.9; }
.stat-n { font-size: 30px; font-weight: 800; font-family: var(--mono); line-height: 1; }
.stat-l { font-size: 12.5px; color: var(--muted); }
.stat.cyan .stat-ic, .stat.cyan .stat-n { color: var(--cyan); }
.stat.violet .stat-ic, .stat.violet .stat-n { color: var(--violet); }
.stat.green .stat-ic, .stat.green .stat-n { color: var(--green); }
.stat.amber .stat-ic, .stat.amber .stat-n { color: var(--amber); }
.stat.pink .stat-ic, .stat.pink .stat-n { color: var(--pink); }
.stat.blue .stat-ic, .stat.blue .stat-n { color: var(--blue); }
.last-build { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 14px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.log-row {
  display: flex; gap: 14px; align-items: flex-start; background: linear-gradient(180deg, var(--panel), var(--bg2));
  border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px;
}
.log-main { flex: 1; min-width: 0; }
.log-title { font-weight: 600; font-size: 14.5px; }
.log-body { color: var(--muted); font-size: 13.5px; margin-top: 3px; overflow-wrap: anywhere; }
.log-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--faint); flex-wrap: wrap; }

.type-badge {
  flex: 0 0 auto; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
  padding: 3px 8px; border-radius: 7px; border: 1px solid; margin-top: 2px;
}
.type-badge.project { color: #b7a7ff; border-color: rgba(157,140,255,0.35); background: rgba(157,140,255,0.12); }
.type-badge.idea { color: #6fdcff; border-color: rgba(56,204,255,0.35); background: rgba(56,204,255,0.10); }
.type-badge.changelog { color: #6ff0c0; border-color: rgba(53,217,160,0.35); background: rgba(53,217,160,0.10); }
.type-badge.build { color: #ffcf6b; border-color: rgba(255,178,36,0.35); background: rgba(255,178,36,0.10); }
.type-badge.code { color: #ff9dc8; border-color: rgba(255,111,174,0.35); background: rgba(255,111,174,0.10); }
.type-badge.dialogue { color: #93bbff; border-color: rgba(91,157,255,0.35); background: rgba(91,157,255,0.10); }

.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 9px;
  border-radius: 999px; border: 1px solid; text-transform: capitalize;
}
.badge.st-active, .badge.st-done, .badge.st-success, .badge.st-shipped { color: var(--green); border-color: rgba(53,217,160,0.4); background: rgba(53,217,160,0.1); }
.badge.st-planned, .badge.st-inbox { color: var(--cyan); border-color: rgba(56,204,255,0.4); background: rgba(56,204,255,0.1); }
.badge.st-considering { color: var(--violet); border-color: rgba(157,140,255,0.4); background: rgba(157,140,255,0.1); }
.badge.st-paused { color: var(--amber); border-color: rgba(255,178,36,0.4); background: rgba(255,178,36,0.1); }
.badge.st-archived { color: var(--muted); border-color: var(--border2); background: rgba(255,255,255,0.04); }
.badge.st-failed { color: var(--red); border-color: rgba(255,95,109,0.4); background: rgba(255,95,109,0.1); }
.badge.st-running { color: var(--amber); border-color: rgba(255,178,36,0.4); background: rgba(255,178,36,0.1); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }

.kind { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; border: 1px solid; text-transform: uppercase; letter-spacing: 0.4px; }
.kind-feature { color: var(--green); border-color: rgba(53,217,160,0.35); background: rgba(53,217,160,0.1); }
.kind-fix { color: var(--amber); border-color: rgba(255,178,36,0.35); background: rgba(255,178,36,0.1); }
.kind-refactor { color: var(--violet); border-color: rgba(157,140,255,0.35); background: rgba(157,140,255,0.1); }
.kind-docs { color: var(--blue); border-color: rgba(91,157,255,0.35); background: rgba(91,157,255,0.1); }
.kind-other { color: var(--muted); border-color: var(--border2); background: rgba(255,255,255,0.05); }

.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 7px; padding: 2px 8px; }
.chip.lang { color: var(--pink); border-color: rgba(255,111,174,0.3); background: rgba(255,111,174,0.08); }

.proj-tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--violet);
  background: rgba(157,140,255,0.1); border: 1px solid rgba(157,140,255,0.28); border-radius: 7px; padding: 1px 8px; cursor: pointer;
}
.proj-tag:hover { background: rgba(157,140,255,0.18); }
.meta-tag { color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 7px; padding: 2px 8px; }

.idea-card { display: flex; flex-direction: column; gap: 8px; }
.idea-top { display: flex; align-items: center; gap: 12px; }
.idea-title { margin: 0; font-size: 15px; font-weight: 650; flex: 1; }
.idea-body { margin: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
.idea-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.idea-foot time { font-size: 12px; color: var(--faint); }

.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.project-card { display: flex; flex-direction: column; gap: 10px; }
.pc-head { display: flex; align-items: center; gap: 10px; }
.pc-name { margin: 0; font-size: 16px; font-weight: 700; flex: 1; }
.pc-tagline { margin: 0; color: var(--muted); font-size: 13.5px; }
.pc-links { display: flex; flex-direction: column; gap: 8px; }
.link-wrap { display: flex; gap: 6px; align-items: center; }
.link-wrap .btn { flex: 1; justify-content: center; }
.pc-counts { display: flex; gap: 6px; flex-wrap: wrap; }
.pc-actions { display: flex; gap: 6px; border-top: 1px solid var(--border); padding-top: 10px; }

.pd-hero {
  display: flex; flex-direction: column; gap: 14px;
  background: linear-gradient(135deg, rgba(56,204,255,0.06), rgba(157,140,255,0.07)), var(--panel);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 22px;
}
.pd-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pd-top h2 { margin: 0; font-size: 22px; }
.pd-tagline { color: var(--muted); margin: 0; }
.pd-desc { margin: 0; color: var(--text); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pd-links { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pd-links .btn { font-size: 14px; padding: 10px 16px; }
.pd-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.pd-section { margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
.pd-section h3 { margin: 0; font-size: 15px; }
.pd-section .count { color: var(--faint); font-family: var(--mono); font-size: 12px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 14px; cursor: pointer; }
.back-link:hover { color: var(--text); }

.timeline { display: flex; flex-direction: column; }
.cl-row { display: flex; gap: 16px; padding: 4px 0; }
.cl-rail { flex: 0 0 70px; display: flex; flex-direction: column; align-items: center; }
.cl-rail::after { content: ""; width: 1px; flex: 1; background: var(--border); margin-top: 8px; }
.cl-row:last-child .cl-rail::after { background: transparent; }
.ver { font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--cyan); background: rgba(56,204,255,0.1); border: 1px solid rgba(56,204,255,0.3); border-radius: 7px; padding: 3px 8px; white-space: nowrap; }
.cl-body { flex: 1; padding-bottom: 16px; min-width: 0; }
.cl-title { font-weight: 650; font-size: 14.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cl-text { color: var(--muted); font-size: 13.5px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cl-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--faint); flex-wrap: wrap; }

.build-row { display: flex; flex-direction: column; gap: 8px; }
.br-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.br-no { font-weight: 700; font-size: 14px; }
.br-summary { color: var(--text); font-size: 14px; }
.br-log { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.br-log summary { cursor: pointer; padding: 8px 12px; font-size: 12.5px; color: var(--muted); background: rgba(255,255,255,0.03); user-select: none; }
.br-log pre { margin: 0; padding: 12px 14px; background: #070b13; color: #c7d4f0; font-size: 12.5px; line-height: 1.5; overflow: auto; max-height: 320px; white-space: pre-wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.dot.st-success { background: var(--green); box-shadow: 0 0 8px rgba(53,217,160,0.7); }
.dot.st-failed { background: var(--red); box-shadow: 0 0 8px rgba(255,95,109,0.7); }
.dot.st-running { background: var(--amber); box-shadow: 0 0 8px rgba(255,178,36,0.7); animation: pulse 1.2s ease-in-out infinite; }

.code-row { display: flex; flex-direction: column; gap: 8px; }
.cr-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.cr-title { margin: 0; font-size: 15px; font-weight: 650; }
.cr-notes { color: var(--muted); font-size: 13px; }
.cr-code { margin: 0; background: #070b13; border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; font-size: 12.5px; line-height: 1.55; color: #c9d6f2; overflow: auto; max-height: 380px; white-space: pre; }

.chat { display: flex; flex-direction: column; gap: 12px; }
.bubble { align-self: flex-start; max-width: 92%; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; }
.bubble.me { align-self: flex-end; background: rgba(56,204,255,0.07); border-color: rgba(56,204,255,0.3); }
.bubble-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); flex-wrap: wrap; }
.bubble-head .speaker { font-weight: 700; color: var(--text); }
.bubble-head .role { font-family: var(--mono); font-size: 10.5px; color: var(--cyan); }
.bubble-body { margin-top: 6px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

.search-box { margin-bottom: 20px; }
#search-input { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 14px 18px; font-size: 16px; outline: none; transition: border 0.15s, box-shadow 0.15s; }
#search-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,204,255,0.12); }
.sr-group { margin-bottom: 20px; }
.sr-group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 8px; }
.sr-group h3 .count { color: var(--faint); font-family: var(--mono); }
.sr-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--border); border-radius: 11px; padding: 11px 14px; margin-bottom: 6px; cursor: pointer; color: var(--text); }
.sr-row:hover { border-color: var(--border2); }
.sr-t { font-weight: 650; font-size: 14px; }
.sr-b { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }

.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--faint); padding: 44px 20px; border: 1px dashed var(--border); border-radius: var(--radius); text-align: center; }
.empty p { margin: 0; font-size: 14px; }
.hint { color: var(--faint); font-size: 14px; text-align: center; padding: 30px; }
time { cursor: default; }

function esc(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&amp;/g, "&")
    .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : "");

function relTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 45) return "just now";
  const m = Math.floor(s / 60); if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60); if (h < 24) return h + "h ago";
  const days = Math.floor(h / 24); if (days < 7) return days + "d ago";
  return fmtAbs(iso);
}
function fmtAbs(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) +
    " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

/* ============================ GitHub Cloud Storage (Option A) ============================ */
function slugify(str) {
  return (str || "project").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

async function clientCommitToGitHub(filePath, contentString, commitMessage) {
  const token = localStorage.getItem("delquro_github_token") || "";
  const repo = localStorage.getItem("delquro_github_repo") || "PlanExServices/Static_Upload";
  const branch = localStorage.getItem("delquro_github_branch") || "main";
  if (!token) return false;

  try {
    const url = `https://api.github.com/repos/${repo}/contents/${filePath}`;
    let existingSha = null;
    try {
      const getRes = await fetch(url + `?ref=${branch}`, {
        headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
      });
      if (getRes.ok) {
        const fileData = await getRes.json();
        existingSha = fileData.sha;
      }
    } catch (e) {}

    // Base64 encode in browser
    const base64Content = btoa(unescape(encodeURIComponent(contentString)));
    const payload = { message: commitMessage, content: base64Content, branch };
    if (existingSha) payload.sha = existingSha;

    const putRes = await fetch(url, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    return putRes.ok;
  } catch (err) {
    console.error("Client GitHub commit error:", err);
    return false;
  }
}

async function autoSyncProjectToGitHub(project) {
  const token = localStorage.getItem("delquro_github_token");
  if (!token) return;
  const slug = slugify(project.name);

  // 1. Commit main database file
  clientCommitToGitHub("data/delquro-db.json", JSON.stringify(db, null, 2), `Cloud Sync: add ${project.name}`);
  // 2. Commit project card JSON
  clientCommitToGitHub(`projects/${slug}.json`, JSON.stringify(project, null, 2), `Cloud Card: ${project.name}`);
  // 3. Commit attached code
  if (project.attached_code) {
    const ext = (project.filename && project.filename.includes(".")) ? project.filename.split(".").pop() : "txt";
    const filename = project.filename || `source.${ext}`;
    clientCommitToGitHub(`code/${slug}/${filename}`, project.attached_code, `Cloud Code: ${project.name}`);
  }
}

/* ============================ AI Intake & Code Analyzer ============================ */
function analyzeCodeInBrowser(rawCode, filename = "") {
  const code = rawCode || "";
  function extract(regex) {
    const m = code.match(regex);
    return m ? m[1].trim() : "";
  }

  let name = extract(/(?:name|project|title):\s*([^\r\n]+)/i);
  let tagline = extract(/(?:tagline|summary):\s*([^\r\n]+)/i);
  let desc = extract(/(?:description|desc|about):\s*([^\r\n]+)/i);
  let diff = extract(/(?:differentiator|edge|sets\s+it\s+apart|unique|moat):\s*([^\r\n]+)/i);
  let stack = extract(/(?:stack|tech|technologies):\s*([^\r\n]+)/i);

  let arena = extract(/(https?:\/\/(?:www\.)?arena\.ai\S*)/i);
  let github = extract(/(https?:\/\/(?:www\.)?github\.com\S*)/i);
  let emergent = extract(/(https?:\/\/(?:www\.)?emergent\.sh\S*)/i);
  let base44 = extract(/(https?:\/\/(?:www\.)?base44\.com\S*)/i);

  // Clean punctuation from URLs
  [arena, github, emergent, base44].forEach((url, i) => {
    const cleaned = url ? url.replace(/[,;)"']+$/, "") : "";
    if (i === 0) arena = cleaned;
    if (i === 1) github = cleaned;
    if (i === 2) emergent = cleaned;
    if (i === 3) base44 = cleaned;
  });

  const detectedStack = [];
  if (/react/i.test(code) || /useState/i.test(code)) detectedStack.push("React");
  if (/typescript|\.tsx?/i.test(filename) || /:\s*(string|number|boolean)/.test(code)) detectedStack.push("TypeScript");
  if (/fastapi/i.test(code)) { detectedStack.push("FastAPI"); detectedStack.push("Python"); }
  else if (/flask/i.test(code)) { detectedStack.push("Flask"); detectedStack.push("Python"); }
  else if (/def |import sys|print\(/i.test(code)) detectedStack.push("Python");
  if (/sqlite/i.test(code)) detectedStack.push("SQLite");
  if (/tailwind|className=/i.test(code)) detectedStack.push("TailwindCSS");
  if (/arena/i.test(code) && !detectedStack.includes("Arena SDK")) detectedStack.push("Arena SDK");
  if (/base44/i.test(code)) detectedStack.push("Base44 SDK");
  if (/emergent/i.test(code)) detectedStack.push("Emergent Engine");
  if (/next/i.test(code) || /getServerSideProps/i.test(code)) detectedStack.push("Next.js");

  if (!stack && detectedStack.length) {
    stack = [...new Set(detectedStack)].join(", ");
  }

  if (!name) {
    const titleMatch = code.match(/<title>([^<]+)<\/title>/i) ||
                       code.match(/FastAPI\s*\(\s*title=["']([^"']+)["']/i) ||
                       code.match(/(?:class|function)\s+([A-Z][A-Za-z0-9_]+)/);
    if (titleMatch) name = titleMatch[1].replace(/([A-Z])/g, " $1").trim();
    else if (filename) name = filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    else name = "AI Generated Idea";
  }

  if (!tagline) {
    tagline = `High-efficiency ${detectedStack.slice(0, 3).join("/") || "software"} architecture built for rapid execution.`;
  }

  if (!desc) {
    const docMatch = code.match(/"""([\s\S]*?)"""/) || code.match(/\/\*([\s\S]*?)\*\//);
    if (docMatch) {
      desc = docMatch[1].replace(/\*/g, "").trim().replace(/\s+/g, " ");
    } else {
      desc = `Streamlined implementation featuring modular components, robust state handling, and optimized execution flow. Designed for scalable deployment with direct integration across modern cloud environments.`;
    }
  }

  const words = desc.trim().split(/\s+/).filter(Boolean);
  if (words.length > 120) {
    desc = words.slice(0, 120).join(" ") + "...";
  }

  if (!diff) {
    diff = "Architected for zero overhead, sub-millisecond dispatch, and seamless portability without heavy runtime bloat.";
  }

  return {
    name,
    tagline,
    description: desc,
    wordCount: countWords(desc),
    stack: stack || "JavaScript, HTML5, CSS3",
    arena_link: arena,
    github_link: github,
    emergent_link: emergent,
    base44_link: base44,
    differentiator: diff,
    filename: filename || "source.txt",
    code
  };
}



function getActiveBackendBase() {
  const custom = localStorage.getItem("delquro_backend_url");
  if (custom) return custom.replace(/\/+$/, "");
  if (window.location.hostname.includes("onrender.com")) return window.location.origin;
  // Always use the permanent public Render backend (never temporary sandbox URLs)
  return "https://static-upload.onrender.com";
}

function getIntakeEndpoint() {
  return getActiveBackendBase() + "/api/intake";
}

async function triggerBackendSync() {
  const base = getActiveBackendBase();
  const endpoint = base + "/api/intake";
  try {
    const headers = {};
    const key = localStorage.getItem("delquro_api_key");
    if (key) headers["X-API-Key"] = key;
    const res = await fetch(endpoint, { headers, mode: "cors" });
    if (res.ok) {
      const data = await res.json();
      if (data.items && Array.isArray(data.items)) {
        const prevCount = (db.inbox || []).length;
        if (JSON.stringify(db.inbox) !== JSON.stringify(data.items)) {
          db.inbox = data.items;
          persist();
          if (state.view === "intake" || state.view === "dashboard") render();
          if (data.items.length > prevCount) toast("New code upload received from AI! ⚡");
        }
      }
    }
  } catch (e) {}
}

function pageHead(title, sub, actionsHTML = "") {

function emptyState(msg) { return `<div class="empty">${icon("masterlog", 22)}<p>${esc(msg)}</p></div>`; }
function countPill(t, n) { return `<span class="pill">${icon(t, 12)} ${n}</span>`; }
function projTag(id) {
  const name = projectName(id);
  return name ? `<button class="proj-tag" data-action="open-project" data-id="${id}">${esc(name)}</button>` : "";
}

function logRowHTML(item) {
  return `<div class="log-row">
    <span class="type-badge ${item.type}">${TYPE_LABEL[item.type] || item.type}</span>
    <div class="log-main">
      <div class="log-title">${esc(item.title)}</div>

      <div class="log-meta">
        ${item.meta ? `<span class="meta-tag">${esc(item.meta)}</span>` : ""}

        <time title="${fmtAbs(item.createdAt)}">${relTime(item.createdAt)}</time>
      </div>
    </div>
  </div>`;
}

function masterLog(typeFilter) {
  const out = [];
  db.projects.forEach(p => out.push({ type: "project", id: p.id, title: p.name, body: p.tagline, meta: "status: " + p.status, projectId: p.id, createdAt: p.createdAt }));
  const add = (t, arr, tf, bf, mf) => arr.forEach(i => out.push({ type: t, id: i.id, title: tf(i), body: bf(i), meta: mf(i), projectId: i.projectId || null, createdAt: i.createdAt }));
  add("idea", db.ideas, i => i.title, i => i.body, i => "status: " + i.status + (i.tags ? " · " + i.tags : ""));
  add("changelog", db.changelog, i => (i.version ? i.version + " · " : "") + i.title, i => i.body, i => i.kind);
  add("build", db.builds, i => (i.buildNo ? i.buildNo + " · " : "") + i.summary, i => "", i => i.status);
  add("code", db.code, i => i.title, i => i.notes, i => i.language || "code");
  add("dialogue", db.dialogues, i => i.speaker, i => i.content, i => i.role);
  let res = typeFilter ? out.filter(o => o.type === typeFilter) : out;
  res.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  return res;
}

function searchAll(q) {
  q = q.toLowerCase();
  const like = s => (s || "").toLowerCase().includes(q);
  return {
    projects: db.projects.filter(p => [p.name, p.tagline, p.description, p.stack].some(like)),
    ideas: db.ideas.filter(i => [i.title, i.body, i.tags].some(like)),
    changelog: db.changelog.filter(i => [i.title, i.body, i.version, i.kind].some(like)),
    builds: db.builds.filter(i => [i.buildNo, i.summary, i.log, i.status].some(like)),
    code: db.code.filter(i => [i.title, i.code, i.notes, i.language].some(like)),
    dialogues: db.dialogues.filter(i => [i.content, i.speaker, i.role].some(like)),
  };
}

let searchTimer;
function renderSearch() {
  setTimeout(() => { const i = $("#search-input"); if (i) i.focus(); }, 0);
  return `${pageHead("Search", "Find anything you logged.")}
    <div class="search-box"><input id="search-input" placeholder="Search ideas, projects, changes, builds, code, dialog…" autocomplete="off" spellcheck="false"></div>
    <div id="search-results"><p class="hint">Type to search across everything.</p></div>`;
}
function runSearch(q) {
  q = q.trim();
  const box = $("#search-results");
  if (!q) { box.innerHTML = '<p class="hint">Type to search across everything.</p>'; return; }
  const r = searchAll(q);
  const groups = [["projects", "Projects"], ["ideas", "Ideas"], ["changelog", "Change Log"], ["builds", "Builds"], ["code", "Code"], ["dialogues", "Dialogues"]];
  box.innerHTML = groups.map(([k, label]) => {
    const items = r[k]; if (!items.length) return "";
    return `<div class="sr-group"><h3>${label} <span class="count">${items.length}</span></h3>${items.map(it => searchRow(k, it)).join("")}</div>`;
  }).join("") || emptyState("No matches.");
}
function searchRow(kind, it) {
  if (kind === "projects") return `<button class="sr-row" data-action="open-project" data-id="${it.id}"><span class="type-badge project">Project</span><span class="sr-t">${esc(it.name)}</span><span class="sr-b">${esc(it.tagline || "")}</span></button>`;
  const t = { ideas: "idea", changelog: "changelog", builds: "build", code: "code", dialogues: "dialogue" }[kind];
  const title = it.title || it.summary || it.speaker || "";
  const body = (it.body || it.notes || it.content || "").slice(0, 140);
  return `<button class="sr-row" data-action="goto" data-view="${kind}"><span class="type-badge ${t}">${TYPE_LABEL[t]}</span><span class="sr-t">${esc(title)}</span><span class="sr-b">${esc(body)}</span></button>`;
}

      { key: "attached_code", label: "Attached Code Snippet", type: "textarea", rows: 6, value: f.attached_code, placeholder: "Paste source code…" },

    onSubmit(d) {

        name: d.name,
        tagline: d.tagline,
        description: desc,
        status: d.status,
        stack: d.stack,
        arena_link: d.arena_link,
        github_link: d.github_link,

        base44_link: d.base44_link,

        attached_code: d.attached_code,
        updatedAt: nowISO()
      };
      if (existing) {
        updateRow("projects", existing.id, data);
      } else {
        addRow("projects", { ...data, createdAt: nowISO() });

function initEvents() {
  document.addEventListener("click", e => {
    if (e.target.closest("a")) return; // let real links work
    const el = e.target.closest("[data-action]");
    if (el) {
      const fn = actions[el.dataset.action];
      if (fn) { e.preventDefault(); fn(el.dataset, el); }
      return;
    }
    const g = e.target.closest("[data-goto]");
    if (g) { go(g.dataset.goto); return; }
    const f = e.target.closest("#idea-filter [data-filter]");
    if (f) { state.ideaFilter = f.dataset.filter; render(); return; }
    const ml = e.target.closest("#ml-filter [data-ml]");
    if (ml) { state.mlFilter = ml.dataset.ml; render(); return; }
  });
  document.addEventListener("change", e => {
    const el = e.target.closest("[data-action]");
    if (el && el.dataset.action === "set-project-status") {
      updateRow("projects", +el.dataset.id, { status: el.value, updatedAt: nowISO() });
      toast(`Project status → ${el.value} (Synced to Cloud ☁️)`);
      render();
      return;
    }
    if (el && el.dataset.action === "set-idea-status") {
      updateRow("ideas", +el.dataset.id, { status: el.value });
      toast(`Idea status → ${el.value} (Synced to Cloud ☁️)`);
      render();
      return;
    }
    const filters = { "cl-project": "clProject", "b-project": "bProject", "c-project": "cProject", "d-project": "dProject" };
    if (filters[e.target.id]) { state[filters[e.target.id]] = e.target.value; render(); }
  });
  document.addEventListener("input", e => {
        if (e.target.id && e.target.id.startsWith("draft-")) {
      if (e.target.id === "draft-desc") updateStudioWordCounter();
      if (state.intakeDraft) {
        const map = {
          "draft-name": "name", "draft-tagline": "tagline", "draft-desc": "description",
          "draft-stack": "stack", "draft-arena": "arena_link", "draft-github": "github_link",
          "draft-emergent": "emergent_link", "draft-base44": "base44_link", "draft-diff": "differentiator",
          "draft-code": "code"
        };
        if (map[e.target.id]) state.intakeDraft[map[e.target.id]] = e.target.value;
      }
      updateLivePreview();
    }
    if (e.target.id === "search-input") {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runSearch(e.target.value), 150);
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeSheet(); } });
}

function initQuickCapture() {
  const sel = $("#qc-type"), inp = $("#qc-input");
  Object.entries(QC).forEach(([k, v]) => { const o = document.createElement("option"); o.value = k; o.textContent = v.label; sel.appendChild(o); });
  inp.placeholder = QC.idea.ph;
  sel.addEventListener("change", () => { inp.placeholder = QC[sel.value].ph; inp.focus(); });
  const goCapture = () => {
    const v = inp.value.trim(); if (!v) return;
    const t = sel.value;
    if (t === "idea") addRow("ideas", { title: v, body: "", tags: "", status: "inbox", projectId: null, createdAt: nowISO() });
    else if (t === "change") addRow("changelog", { title: v, version: "", kind: "feature", body: "", projectId: null, createdAt: nowISO() });
    else if (t === "build") addRow("builds", { buildNo: "", status: "success", summary: v, log: "", projectId: null, createdAt: nowISO() });
    else addRow("dialogues", { speaker: "you", role: "user", content: v, projectId: null, createdAt: nowISO() });
    toast(QC[t].label + " logged ✓");
    inp.value = ""; inp.focus(); render();
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); goCapture(); } });
  $("#qc-btn").addEventListener("click", goCapture);
}

/* ============================ mobile sheets ============================ */
let sheetType = "idea";
function captureAdd(v) {
  if (sheetType === "idea") addRow("ideas", { title: v, body: "", tags: "", status: "inbox", projectId: null, createdAt: nowISO() });
  else if (sheetType === "change") addRow("changelog", { title: v, version: "", kind: "feature", body: "", projectId: null, createdAt: nowISO() });
  else if (sheetType === "build") addRow("builds", { buildNo: "", status: "success", summary: v, log: "", projectId: null, createdAt: nowISO() });
  else addRow("dialogues", { speaker: "you", role: "user", content: v, projectId: null, createdAt: nowISO() });
}
function openCaptureSheet() {
  sheetType = "idea";
  openSheet(`<div class="sheet-head"><h3>Log it</h3><button class="icon-btn sheet-close" aria-label="Close">✕</button></div>
    <div class="seg capture-seg" id="capture-seg">
      ${["idea", "change", "build", "dialog"].map(t => `<button class="seg-btn ${t === sheetType ? "on" : ""}" data-ctype="${t}">${QC[t].label}</button>`).join("")}
    </div>
    <textarea id="capture-input" class="capture-input" placeholder="${QC.idea.ph}" rows="4"></textarea>
    <button class="btn primary capture-go" id="capture-go">Log it</button>`);
  const inp = $("#capture-input");
  setTimeout(() => inp.focus(), 60);
  $("#capture-seg").addEventListener("click", e => {
    const b = e.target.closest("[data-ctype]"); if (!b) return;
    sheetType = b.dataset.ctype;
    $$("#capture-seg .seg-btn").forEach(x => x.classList.toggle("on", x.dataset.ctype === sheetType));
    inp.placeholder = QC[sheetType].ph; inp.focus();
  });
  const submit = () => {
    const v = inp.value.trim(); if (!v) return;
    captureAdd(v); toast(QC[sheetType].label + " logged ✓");
    closeSheet(); render();
  };
  $("#capture-go").addEventListener("click", submit);
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
}

/* ============================ export / import / clear ============================ */
function exportBackup() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "delquro-files-backup.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  toast("Backup downloaded ✓");
}
function importBackup() { $("#import-file").click(); }
$("#import-file").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      let raw = (reader.result || "").trim();
      // Strip markdown code fences if user saved direct AI chat response: ```json ... ```
      raw = raw.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
      const data = JSON.parse(raw);

      // Case 1: Full DelQuro backup (contains projects array alongside ideas, builds, etc.)
      if (data && Array.isArray(data.projects)) {
        db = Object.assign(emptyDB(), data);
        if (!db.inbox) db.inbox = [];
        persist(); render(); toast("Full DelQuro backup restored ✓");
        return;
      }

      // Case 2: Array of project cards [ { name: "...", ... }, ... ]
      if (Array.isArray(data)) {
        let count = 0;
        data.forEach(item => {
          if (item && (item.name || item.title)) {
            const analyzed = analyzeCodeInBrowser(item.code || "", item.filename || "");
            let desc = (item.description || item.desc || analyzed.description || "").trim();
            const words = desc.split(/\s+/).filter(Boolean);
            if (words.length > 120) desc = words.slice(0, 120).join(" ") + "...";

            const newProj = {
              id: uid(),
              name: (item.name || item.title || analyzed.name).trim(),
              tagline: (item.tagline || item.summary || analyzed.tagline).trim(),
              description: desc,
              status: item.status || "active",
              stack: (item.stack || analyzed.stack).trim(),
              arena_link: (item.arena_link || item.arena_url || analyzed.arena_link).trim(),
              github_link: (item.github_link || item.github_url || analyzed.github_link).trim(),
              emergent_link: (item.emergent_link || item.emergent_url || analyzed.emergent_link).trim(),
              base44_link: (item.base44_link || item.base44_url || analyzed.base44_link).trim(),
              differentiator: (item.differentiator || item.edge || analyzed.differentiator).trim(),
              attached_code: item.code || "",
              createdAt: nowISO(),
              updatedAt: nowISO()
            };
            db.projects.unshift(newProj);
            count++;
          }
        });
        persist(); render();
        toast(`Imported ${count} project cards successfully! 🚀`);
        go("projects");
        return;
      }

      // Case 3: Single project card or AI intake payload { name: "...", description: "...", ... }
      if (data && (data.name || data.title || data.code || data.description)) {
        const analyzed = analyzeCodeInBrowser(data.code || "", data.filename || "");
        let desc = (data.description || data.desc || analyzed.description || "").trim();
        const words = desc.split(/\s+/).filter(Boolean);
        if (words.length > 120) desc = words.slice(0, 120).join(" ") + "...";

        const newProj = {
          id: uid(),
          name: (data.name || data.title || analyzed.name).trim(),
          tagline: (data.tagline || data.summary || analyzed.tagline).trim(),
          description: desc,
          status: data.status || "active",
          stack: (data.stack || analyzed.stack).trim(),
          arena_link: (data.arena_link || data.arena_url || analyzed.arena_link).trim(),
          github_link: (data.github_link || data.github_url || analyzed.github_link).trim(),
          emergent_link: (data.emergent_link || data.emergent_url || analyzed.emergent_link).trim(),
          base44_link: (data.base44_link || data.base44_url || analyzed.base44_link).trim(),
          differentiator: (data.differentiator || data.edge || analyzed.differentiator).trim(),
          attached_code: data.code || "",
          createdAt: nowISO(),
          updatedAt: nowISO()
        };

        db.projects.unshift(newProj);

        if (newProj.attached_code) {
          db.code.unshift({
            id: uid(),
            projectId: newProj.id,
            title: (data.filename || newProj.name) + " (Source)",
            language: (newProj.stack || "code").split(",")[0].toLowerCase().trim(),
            notes: `Imported via JSON for ${newProj.name}`,
            code: newProj.attached_code,
            createdAt: nowISO()
          });
        }

        persist();
        toast(`Project "${newProj.name}" imported into DelQuro Files! 🚀`);
        go("project", newProj.id);
        return;
      }

      throw new Error("Unrecognized JSON format. File must contain project card details or a DelQuro backup.");
    } catch (err) { toast("Import failed: " + err.message, "error"); }
    e.target.value = "";
  };
  reader.readAsText(file);
});
async function clearAll() {
  if (await confirmBox("Delete EVERYTHING (all projects, ideas, logs, code, dialog)? This cannot be undone.")) {
    db = emptyDB(); persist(); render(); toast("All data cleared");
  }

/* ============================ URL & GitHub Issues Intake Receiver ============================ */
function checkURLForIntakePayload() {
  try {
    let payload = null;
    const hash = window.location.hash;
    const search = window.location.search;

    if (hash && (hash.includes("intake=") || hash.includes("upload="))) {
      const raw = hash.replace(/^#/, "").split(/(?:intake|upload)=/)[1];
      if (raw) {
        try {
          payload = JSON.parse(decodeURIComponent(raw));
        } catch (e) {
          try {
            payload = JSON.parse(atob(decodeURIComponent(raw)));
          } catch (e2) {}
        }
      }
    } else if (search) {
      const params = new URLSearchParams(search);
      if (params.get("intake") || params.get("upload")) {
        const raw = params.get("intake") || params.get("upload");
        try {
          payload = JSON.parse(decodeURIComponent(raw));
        } catch (e) {
          try {
            payload = JSON.parse(atob(decodeURIComponent(raw)));
          } catch (e2) {}
        }
      } else if (params.get("name") || params.get("code")) {
        payload = {
          name: params.get("name") || "",
          tagline: params.get("tagline") || "",
          description: params.get("description") || params.get("desc") || "",
          stack: params.get("stack") || "",
          arena_link: params.get("arena") || params.get("arena_link") || "",
          github_link: params.get("github") || params.get("github_link") || "",
          emergent_link: params.get("emergent") || params.get("emergent_link") || "",
          base44_link: params.get("base44") || params.get("base44_link") || "",
          differentiator: params.get("edge") || params.get("diff") || params.get("differentiator") || "",
          code: params.get("code") || ""
        };
      }
    }

    if (payload && (payload.name || payload.code || payload.description)) {
      const analyzed = analyzeCodeInBrowser(payload.code || "", payload.filename || "");
      let desc = (payload.description || payload.desc || analyzed.description || "").trim();
      const words = desc.split(/\s+/).filter(Boolean);
      if (words.length > 120) {
        desc = words.slice(0, 120).join(" ") + "...";
      }

      const item = {
        id: "url-" + Date.now(),
        name: (payload.name || payload.title || analyzed.name).trim(),
        tagline: (payload.tagline || payload.summary || analyzed.tagline).trim(),
        description: desc,
        wordCount: countWords(desc),
        stack: (payload.stack || analyzed.stack).trim(),
        arena_link: (payload.arena_link || payload.arena || analyzed.arena_link).trim(),
        github_link: (payload.github_link || payload.github || analyzed.github_link).trim(),
        emergent_link: (payload.emergent_link || payload.emergent || analyzed.emergent_link).trim(),
        base44_link: (payload.base44_link || payload.base44 || analyzed.base44_link).trim(),
        differentiator: (payload.differentiator || payload.edge || payload.diff || analyzed.differentiator).trim(),
        code: payload.code || "",
        status: "pending",
        createdAt: nowISO()
      };

      if (!db.inbox) db.inbox = [];
      const dupIdx = db.inbox.findIndex(i => i.name === item.name);
      if (dupIdx !== -1) {
        db.inbox[dupIdx] = item;
      } else {
        db.inbox.unshift(item);
      }

      persist();
      state.intakeDraft = Object.assign({}, item);
      go("intake");
      toast("AI Project loaded into Card Studio! ⚡");

      if (window.history && window.history.replaceState) {
        const cleanURL = window.location.pathname;
        window.history.replaceState({}, document.title, cleanURL);
      }
    }
  } catch (err) {
    console.error("Error parsing URL intake payload", err);
  }
}

async function syncGitHubIssuesIntake() {
  const repo = "PlanExServices/Static_Upload";
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/issues?state=open&per_page=20`, {
      headers: { Accept: "application/vnd.github.v3+json" }
    });
    if (res.ok) {
      const issues = await res.json();
      let newCount = 0;
      if (!db.inbox) db.inbox = [];

      issues.forEach(issue => {
        const title = issue.title || "";
        const body = issue.body || "";
        const id = "gh-" + issue.number;

        if (!db.inbox.some(i => i.id === id)) {
          let data = {};
          const jsonMatch = body.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            try { data = JSON.parse(jsonMatch[0]); } catch (e) {}
          }

          const analyzed = analyzeCodeInBrowser(data.code || body, data.filename || "github_issue.txt");
          let desc = (data.description || analyzed.description || "").trim();
          const words = desc.split(/\s+/).filter(Boolean);
          if (words.length > 120) desc = words.slice(0, 120).join(" ") + "...";

          db.inbox.unshift({
            id,
            name: (data.name || title.replace(/\[AI Intake\]/i, "") || analyzed.name).trim(),
            tagline: (data.tagline || analyzed.tagline).trim(),
            description: desc,
            wordCount: countWords(desc),
            stack: (data.stack || analyzed.stack).trim(),
            arena_link: (data.arena_link || analyzed.arena_link).trim(),
            github_link: (data.github_link || analyzed.github_link).trim(),
            emergent_link: (data.emergent_link || analyzed.emergent_link).trim(),
            base44_link: (data.base44_link || analyzed.base44_link).trim(),
            differentiator: (data.differentiator || analyzed.differentiator).trim(),
            code: data.code || body,
            status: "pending",
            createdAt: issue.created_at || nowISO()
          });
          newCount++;
        }
      });

      if (newCount > 0) {
        persist();
        updateCounts();
        if (state.view === "intake" || state.view === "dashboard") render();
        toast(`Synced ${newCount} new project(s) from GitHub Issues! ✓`);
      }
    }
  } catch (e) {
    // Quietly ignore if network/rate-limited
  }
}

async function syncWithServerOnBoot() {
  try {
    let cloudData = null;

    // 1. Try Render cloud server
    try {
      const res = await fetch("https://static-upload.onrender.com/api/db", { mode: "cors" });
      if (res.ok) cloudData = await res.json();
    } catch (e) {}

    // 2. If Render didn't respond or empty, pull directly from GitHub repository!
    if (!cloudData || (!cloudData.projects && !cloudData.ideas)) {
      try {
        const ghRepo = localStorage.getItem("delquro_github_repo") || "PlanExServices/Static_Upload";
        const ghBranch = localStorage.getItem("delquro_github_branch") || "main";
        const ghRes = await fetch(`https://raw.githubusercontent.com/${ghRepo}/${ghBranch}/data/delquro-db.json?t=` + Date.now());
        if (ghRes.ok) cloudData = await ghRes.json();
      } catch (e) {}
    }

    if (cloudData && (Array.isArray(cloudData.projects) || Array.isArray(cloudData.ideas) || Array.isArray(cloudData.inbox))) {
      // Merge projects: restore even if browser was completely cleared!
      const localProjects = db.projects || [];
      const mergedProjects = [...localProjects];
      (cloudData.projects || []).forEach(cp => {
        const idx = mergedProjects.findIndex(p => p.id === cp.id);
        if (idx === -1) mergedProjects.push(cp);
        else mergedProjects[idx] = Object.assign({}, cp, mergedProjects[idx]);
      });
      db.projects = mergedProjects;

      if (cloudData.inbox && cloudData.inbox.length) db.inbox = cloudData.inbox;
      if (cloudData.ideas && cloudData.ideas.length) db.ideas = cloudData.ideas;
      if (cloudData.changelog && cloudData.changelog.length) db.changelog = cloudData.changelog;
      if (cloudData.builds && cloudData.builds.length) db.builds = cloudData.builds;
      if (cloudData.code && cloudData.code.length) db.code = cloudData.code;
      if (cloudData.dialogues && cloudData.dialogues.length) db.dialogues = cloudData.dialogues;
      if (cloudData.nextId && cloudData.nextId > db.nextId) db.nextId = cloudData.nextId;

      persist(false); // save to localStorage without recursive push
      render();
      if (mergedProjects.length > 0) {
        toast(`Restored ${mergedProjects.length} project(s) from Cloud Storage ☁️`);
      }
    }
  } catch (err) {
    console.error("Boot cloud restore error:", err);
  }
}

updateStorageDot();
render();
syncWithServerOnBoot();
checkURLForIntakePayload();
syncGitHubIssuesIntake();

// Background receiver polling: check for new AI code uploads every 4 seconds
if (window.location.protocol.startsWith("http")) {
  setInterval(triggerBackendSync, 4000);
}
