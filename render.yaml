services:
  - type: web
    name: static-upload
    runtime: node
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: uncomment and set a secret token in Render environment settings to protect your API
      # - key: INTAKE_API_KEY
      #   generateValue: true
